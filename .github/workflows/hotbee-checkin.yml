name: HotBee 每日签到

on:
  schedule:
    # 北京时间 00:05（UTC 前一天 16:05）
    - cron: "5 16 * * *"
    # 兜底：GitHub 定时触发经常推迟数小时，多设几次，脚本幂等（已签会自动跳过）
    - cron: "30 1 * * *"   # 北京时间 09:30
    - cron: "0 4 * * *"    # 北京时间 12:00
    - cron: "30 9 * * *"   # 北京时间 17:30
  workflow_dispatch:
    inputs:
      via_cf:
        description: 来自 Cloudflare 准点触发器
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 恢复上次记录的积分
        uses: actions/cache@v4
        with:
          path: .hb
          key: hb-pts-${{ github.run_id }}
          restore-keys: |
            hb-pts-

      - name: 执行签到
        env:
          HOTBEE_TOKEN: ${{ secrets.HOTBEE_TOKEN }}
          HOTBEE_ACCOUNTS: ${{ secrets.HOTBEE_ACCOUNTS }}
          HB_STATE_DIR: .hb
          # 定时触发或 Cloudflare 准点触发时，在窗口内随机延迟 0~50 分钟（防风控）；
          # 手动触发不延迟，便于测试
          RANDOM_DELAY_MAX_SECONDS: ${{ (github.event_name == 'schedule' || github.event.inputs.via_cf == 'true') && '3000' || '0' }}
        run: node checkin.mjs
